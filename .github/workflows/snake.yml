name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Two variants so the grid stays clean in both GitHub themes. The empty-cell
      # colour (first entry of color_dots) matches each theme background: dark for the
      # dark SVG, ivory for the light SVG. Snake and higher levels use the brand red.
      - name: Generate snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?color_snake=b8260f&color_dots=#0d1117,#5a1a10,#8c1c08,#c0341a,#b8260f
            dist/github-snake.svg?color_snake=b8260f&color_dots=#ebe2d0,#e0b8a0,#c97a5c,#b8260f,#8c1c08

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
